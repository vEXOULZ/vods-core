name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conventions:
    uses: vEXOULZ/conventions/.github/workflows/conventions-check.yml@v1.0.1
    secrets: inherit

  ci:
    # Installs with --ignore-scripts, so `prepare` (the build) runs only as its own step; `pack` checks
    # what a git install of a tag would get.
    uses: vEXOULZ/conventions/.github/workflows/node-ci.yml@v1.0.1
    with:
      pack: true
